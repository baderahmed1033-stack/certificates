<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="ملف الإنجازات — محمي بكلمة مرور." />
  <title>ملف الإنجازات</title>

  <!-- معاينة المشاركة (واتساب وغيره): عدّل الرابطين بعد رفع الموقع، وصورة og.jpg مقاسها 1200×630 -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="ملف الإنجازات" />
  <meta property="og:description" content="الشهادات المهنية والأنشطة." />
  <meta property="og:image" content="https://YOUR-SITE.com/og.jpg" />
  <meta property="og:url" content="https://YOUR-SITE.com/" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="theme-color" content="#0a0f1e" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0f1e;
      --bg-soft: #0f1630;
      --card: #131a35;
      --border: rgba(148,163,184,.15);
      --text: #e8ecf5;
      --muted: #8d99b8;
      --accent: #5b8cff;
      --accent-2: #22d3a6;
      --radius: 18px;
      --nav-h: 64px;
      --tag-issuer: #a9c2ff;
      --tag-hours: #7ff0cf;
      --glass: rgba(255,255,255,.05);
    }
    /* ===== الوضع الفاتح ===== */
    :root[data-theme="light"] {
      --bg: #f5f7fc; --bg-soft: #ffffff; --card: #ffffff;
      --border: rgba(15,23,42,.12); --text: #0f172a; --muted: #5b6785;
      --accent: #3b63d8; --accent-2: #0b9c78;
      --tag-issuer: #2f55c9; --tag-hours: #0b8f6f;
      --glass: rgba(15,23,42,.05);
    }
    [data-theme="light"] .topbar { background: rgba(255,255,255,.88); }
    [data-theme="light"] .nav-links a:hover { background: rgba(0,0,0,.05); }
    [data-theme="light"] .nav-links a.active { color: #1d3fa8; background: rgba(59,99,216,.14); }
    [data-theme="light"] .stat { background: #fff; }
    [data-theme="light"] .cert:hover, [data-theme="light"] .cert:focus-visible { box-shadow: 0 18px 40px rgba(15,23,42,.14); }
    [data-theme="light"] .gate-card, [data-theme="light"] .modal-content { box-shadow: 0 30px 80px rgba(15,23,42,.18); }
    [data-theme="light"] .modal { background: rgba(15,23,42,.55); }
    [data-theme="light"] .icon-btn { color: var(--text); background: rgba(15,23,42,.06); }
    [data-theme="light"] .gate-error { color: #d12f2f; }
    [data-theme="light"] .btn.primary { color: #fff; }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { scroll-behavior: smooth; scroll-padding-top: calc(var(--nav-h) + 16px); }
    body {
      margin: 0;
      font-family: 'Tajawal','Segoe UI',Tahoma,sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    body.locked { overflow: hidden; }
    button { font-family: inherit; }

    /* ===== Login gate ===== */
    body.gated .topbar, body.gated .hero, body.gated #main,
    body.gated #noResults, body.gated footer { display: none; }
    .gate {
      display: none;
      min-height: 100vh; padding: 20px;
      align-items: center; justify-content: center;
      background:
        radial-gradient(55% 70% at 85% 0%, rgba(91,140,255,.24), transparent 60%),
        radial-gradient(45% 60% at 8% 100%, rgba(34,211,166,.15), transparent 60%),
        var(--bg);
    }
    body.gated .gate { display: flex; }
    .gate-card {
      width: min(400px, 100%); padding: 34px 28px 28px; text-align: center;
      background: var(--bg-soft);
      border: 1px solid var(--border); border-radius: 22px;
      box-shadow: 0 30px 80px rgba(0,0,0,.55);
    }
    .gate-icon {
      width: 56px; height: 56px; margin: 0 auto 16px;
      display: grid; place-items: center; color: var(--accent);
      background: rgba(91,140,255,.14);
      border: 1px solid rgba(91,140,255,.35); border-radius: 16px;
    }
    .gate-card h1 { margin: 0 0 6px; font-size: 22px; font-weight: 800; }
    .gate-card p { margin: 0 0 22px; color: var(--muted); font-size: 14.5px; }
    .gate-card label { display: block; text-align: start; font-size: 13px; color: var(--muted); margin: 0 2px 6px; }
    .gate-card input {
      width: 100%; margin-bottom: 14px;
      font-family: inherit; font-size: 15px; padding: 12px 14px;
      color: var(--text); background: var(--card);
      border: 1px solid var(--border); border-radius: 12px; outline: none; transition: .2s;
    }
    .gate-card input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(91,140,255,.2); }
    .gate-card .btn { width: 100%; padding: 12px 20px; font-size: 15px; margin-top: 4px; }
    .gate-card .btn:disabled { opacity: .6; cursor: not-allowed; }
    .gate-error { min-height: 22px; margin-top: 12px; font-size: 13.5px; color: #ff8a8a; }
    .gate-card.shake { animation: shake .35s; }
    @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

    /* ===== Top nav ===== */
    .topbar {
      position: sticky; top: 0; z-index: 500;
      height: var(--nav-h);
      background: rgba(10,15,30,.82);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }
    .topbar-inner {
      max-width: 1200px; height: 100%;
      margin: 0 auto; padding: 0 20px;
      display: flex; align-items: center; gap: 14px;
    }
    .brand { font-weight: 800; font-size: 17px; white-space: nowrap; }
    .brand span { color: var(--accent); }
    .nav-links {
      display: flex; gap: 2px; flex: 1; min-width: 0;
      overflow-x: auto; scrollbar-width: none;
    }
    .nav-links::-webkit-scrollbar { display: none; }
    .nav-links a {
      white-space: nowrap;
      text-decoration: none;
      font-size: 13.5px;
      color: var(--muted);
      padding: 8px 11px;
      border-radius: 10px;
      transition: .2s;
    }
    .nav-links a:hover { color: var(--text); background: rgba(255,255,255,.05); }
    .nav-links a.active { color: #fff; background: rgba(91,140,255,.2); }
    .search { position: relative; width: 170px; flex-shrink: 0; }
    .search input {
      width: 100%;
      font-family: inherit; font-size: 14px;
      padding: 9px 38px 9px 12px;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px; outline: none; transition: .2s;
    }
    .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(91,140,255,.2); }
    .search svg { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); opacity: .5; }
    .tool-btn {
      flex-shrink: 0; min-width: 40px; height: 38px; padding: 0 12px;
      font-size: 14px; font-weight: 700; color: var(--text); cursor: pointer;
      background: var(--card); border: 1px solid var(--border); border-radius: 10px; transition: .2s;
    }
    .tool-btn:hover { border-color: var(--accent); }

    /* ===== Hero ===== */
    .hero {
      padding: 70px 20px 54px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      background:
        radial-gradient(55% 80% at 85% 0%, rgba(91,140,255,.24), transparent 60%),
        radial-gradient(45% 70% at 8% 0%, rgba(34,211,166,.15), transparent 60%),
        var(--bg);
    }
    .eyebrow {
      display: inline-block; padding: 6px 14px; margin-bottom: 18px;
      font-size: 13px; font-weight: 500; color: var(--accent-2);
      background: rgba(34,211,166,.1);
      border: 1px solid rgba(34,211,166,.3);
      border-radius: 999px;
    }
    .hero h1 { margin: 0 0 10px; font-size: clamp(30px,5vw,48px); font-weight: 800; letter-spacing: -.5px; }
    .hero h1 span {
      background: linear-gradient(90deg,var(--accent),var(--accent-2));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .hero p { margin: 0 auto; max-width: 580px; color: var(--muted); font-size: 17px; }
    .stats { display: flex; justify-content: center; flex-wrap: wrap; gap: 14px; margin-top: 34px; }
    .stat {
      min-width: 130px; padding: 16px 22px;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--border); border-radius: 16px;
    }
    .stat b { display: block; font-size: 28px; font-weight: 800; }
    .stat span { font-size: 13px; color: var(--muted); }
    .hero-actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
    .hero-actions .btn { text-decoration: none; display: inline-block; }

    /* ===== Sections ===== */
    .container { max-width: 1200px; margin: 0 auto; padding: 20px 20px 60px; }
    .section { padding: 44px 0 8px; }
    .section + .section { border-top: 1px solid var(--border); margin-top: 28px; }
    .section-head { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
    .section-icon {
      width: 50px; height: 50px; flex-shrink: 0;
      display: grid; place-items: center;
      color: var(--c, var(--accent));
      background: color-mix(in srgb, var(--c, var(--accent)) 14%, transparent);
      border: 1px solid color-mix(in srgb, var(--c, var(--accent)) 35%, transparent);
      border-radius: 14px;
    }
    .section-head h2 { margin: 0; font-size: 24px; font-weight: 800; }
    .section-head p { margin: 2px 0 0; color: var(--muted); font-size: 14.5px; }
    .count {
      margin-inline-start: auto;
      font-size: 13px; padding: 4px 12px;
      color: var(--muted);
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 999px; white-space: nowrap;
    }

    .certs { display: grid; grid-template-columns: repeat(auto-fill,minmax(min(280px,100%),1fr)); gap: 22px; }
    .cert {
      display: flex; flex-direction: column; padding: 0;
      text-align: start; color: inherit; cursor: pointer;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: transform .3s, box-shadow .3s, border-color .3s;
    }
    .cert:hover, .cert:focus-visible {
      transform: translateY(-6px);
      border-color: color-mix(in srgb, var(--c, var(--accent)) 60%, transparent);
      box-shadow: 0 18px 40px rgba(0,0,0,.45);
      outline: none;
    }
    .thumb { position: relative; aspect-ratio: 16/10; background: var(--bg-soft); overflow: hidden; }
    .thumb img {
      width: 100%; height: 100%; display: block;
      object-fit: cover; object-position: top center;
      transition: transform .5s;
    }
    .cert:hover .thumb img { transform: scale(1.06); }
    .thumb::after {
      content: attr(data-view);
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; color: #fff;
      background: rgba(10,15,30,.62);
      opacity: 0; transition: opacity .3s;
    }
    .cert:hover .thumb::after, .cert:focus-visible .thumb::after { opacity: 1; }
    .body { padding: 15px 17px 17px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
    .body h3 { margin: 0; font-size: 16px; font-weight: 700; line-height: 1.5; }
    .meta { display: flex; flex-wrap: wrap; gap: 7px; margin-top: auto; }
    .tag {
      font-size: 12px; padding: 3px 10px; border-radius: 999px;
      color: var(--muted);
      background: var(--glass);
      border: 1px solid var(--border);
    }
    .tag.issuer { color: var(--tag-issuer); background: rgba(91,140,255,.12); border-color: rgba(91,140,255,.3); }
    .tag.hours { color: var(--tag-hours); background: rgba(34,211,166,.1); border-color: rgba(34,211,166,.28); }

    .placeholder {
      grid-column: 1 / -1;
      text-align: center; padding: 42px 20px;
      color: var(--muted);
      border: 1.5px dashed rgba(148,163,184,.3);
      border-radius: var(--radius);
      background: var(--glass);
    }
    .placeholder b { display: block; color: var(--text); font-size: 17px; margin-bottom: 6px; }
    .placeholder code { direction: ltr; unicode-bidi: embed; background: var(--glass); padding: 2px 8px; border-radius: 6px; font-size: 13px; color: var(--tag-issuer); }

    .no-results { display: none; text-align: center; color: var(--muted); padding: 70px 0; }

    footer { text-align: center; padding: 28px 20px; color: var(--muted); font-size: 14px; border-top: 1px solid var(--border); }

    /* ===== Modal ===== */
    .modal {
      position: fixed; inset: 0; z-index: 1000;
      display: none; align-items: center; justify-content: center; padding: 20px;
      background: rgba(5,8,18,.84); backdrop-filter: blur(8px);
    }
    .modal.active { display: flex; animation: fade .25s ease; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    .modal-content {
      position: relative; width: min(960px,100%); max-height: 94vh; overflow-y: auto;
      padding: 58px 22px 22px; text-align: center;
      background: var(--bg-soft);
      border: 1px solid var(--border); border-radius: 22px;
      box-shadow: 0 30px 80px rgba(0,0,0,.6);
    }
    .modal-img-wrap { background: #fff; border-radius: 14px; padding: 6px; margin-bottom: 18px; }
    .modal-content img { display: block; max-width: 100%; max-height: 62vh; margin: 0 auto; object-fit: contain; border-radius: 10px; }
    .modal-content h3 { margin: 0 0 8px; font-size: 22px; }
    .modal-content p { margin: 0 auto; max-width: 640px; color: var(--muted); }
    .modal-meta { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }
    .actions { display: flex; justify-content: center; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
    .btn {
      font-size: 14px; font-weight: 600; padding: 10px 20px;
      color: var(--text); background: var(--card);
      border: 1px solid var(--border); border-radius: 12px;
      cursor: pointer; transition: .2s; text-decoration: none; display: inline-block;
    }
    .btn:hover { border-color: var(--accent); }
    .btn.primary { color: #fff; background: linear-gradient(135deg,var(--accent),#3b63d8); border-color: transparent; }
    .btn.primary:hover { filter: brightness(1.1); }
    .icon-btn {
      position: absolute; top: 14px; z-index: 5;
      width: 38px; height: 38px; display: grid; place-items: center;
      font-size: 18px; color: #fff; cursor: pointer;
      background: rgba(255,255,255,.1);
      border: 1px solid var(--border); border-radius: 50%; transition: .2s;
    }
    .icon-btn:hover { background: rgba(255,255,255,.2); }
    .close { inset-inline-start: 14px; }

    /* ===== Profile avatar + card ===== */
    .profile-btn {
      display: flex; align-items: center; gap: 10px; flex-shrink: 0;
      padding: 4px 4px 4px 14px;
      color: inherit; cursor: pointer;
      background: none; border: 1px solid transparent; border-radius: 999px;
      transition: .2s;
    }
    .profile-btn:hover, .profile-btn:focus-visible { background: var(--glass); border-color: var(--border); outline: none; }
    .avatar {
      width: 38px; height: 38px; flex-shrink: 0;
      display: grid; place-items: center;
      font-weight: 800; font-size: 18px; color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-radius: 50%;
      box-shadow: 0 0 0 2px rgba(91,140,255,.35);
    }
    .avatar.lg { width: 88px; height: 88px; font-size: 40px; margin: 6px auto 14px; box-shadow: 0 0 0 4px rgba(91,140,255,.25); }
    .profile-card { width: min(420px, 100%); }
    .profile-card h3 { margin: 0 0 8px; font-size: 22px; }
    .p-role {
      display: inline-block; padding: 4px 14px; font-size: 13px; font-weight: 600;
      color: var(--accent-2); background: rgba(34,211,166,.1);
      border: 1px solid rgba(34,211,166,.3); border-radius: 999px;
    }
    .p-rows { display: grid; gap: 10px; margin-top: 20px; text-align: start; }
    .p-row {
      display: flex; justify-content: space-between; align-items: center; gap: 14px;
      padding: 12px 14px;
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    }
    .p-row span { color: var(--muted); font-size: 13.5px; white-space: nowrap; }
    .p-row b { font-size: 15px; font-weight: 700; }

    /* ===== Picker + Lightbox ===== */
    .pick-list { display: grid; gap: 8px; max-height: 60vh; overflow-y: auto; padding-inline-end: 2px; }
    .pick-sec { margin-top: 8px; font-size: 13px; font-weight: 700; color: var(--accent); }
    .pick-item {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      padding: 11px 14px; font-size: 14.5px; text-align: start; color: var(--text); cursor: pointer;
      background: var(--card); border: 1px solid var(--border); border-radius: 12px; transition: .2s;
    }
    .pick-item:hover, .pick-item:focus-visible { border-color: var(--accent); outline: none; }
    .pick-item.done .pick-dl { color: var(--accent-2); }
    .pick-dl { flex-shrink: 0; font-weight: 800; color: var(--muted); }
    .lightbox { padding: 0; align-items: stretch; z-index: 1200; background: rgba(5,8,18,.95); }
    .lb-stage { width: 100%; height: 100%; overflow: auto; display: flex; }
    .lb-stage img { margin: auto; display: block; background: #fff; cursor: zoom-in; transition: width .2s; }
    .lb-stage img.fit { max-width: 100%; max-height: 100vh; object-fit: contain; }
    .lb-stage img.zoomed { max-width: none; max-height: none; height: auto; cursor: zoom-out; }
    .lb-tools {
      position: absolute; top: 14px; inset-inline-end: 14px; z-index: 6;
      display: flex; align-items: center; gap: 8px; padding: 4px 8px;
      color: #fff; font-size: 13px; background: rgba(15,22,48,.85);
      border: 1px solid var(--border); border-radius: 12px;
    }
    .lb-tools .tool-btn { min-width: 36px; height: 34px; font-size: 18px; padding: 0 8px; }
    .lightbox .icon-btn { color: #fff; background: rgba(255,255,255,.12); }

    /* ===== English / LTR ===== */
    [dir="ltr"] .search input { padding: 9px 12px 9px 38px; }
    [dir="ltr"] .search svg { right: auto; left: 12px; }
    [dir="ltr"] .profile-btn { padding: 4px 14px 4px 4px; }
    [dir="ltr"] .hero h1 { letter-spacing: 0; }

    @media (max-width: 1150px) { .brand { display: none; } .search { width: 140px; } }
    @media (max-width: 760px) {
      :root { --nav-h: 100px; }
      .topbar { height: auto; }
      .topbar-inner { height: auto; flex-wrap: wrap; padding: 8px 12px 4px; gap: 8px; }
      .profile-btn { order: 0; padding: 0 !important; }
      .search { order: 1; flex: 1; width: auto; min-width: 0; }
      #btnTheme { order: 2; } #btnLang { order: 3; }
      .nav-links { order: 4; flex: 0 0 100%; padding-bottom: 4px; }
      .nav-links a { padding: 7px 12px; }
      .hero { padding: 36px 16px 30px; }
      .hero p { font-size: 15px; }
      .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 24px; }
      .stat { min-width: 0; padding: 10px 6px; border-radius: 14px; }
      .stat b { font-size: 21px; }
      .stat span { font-size: 12px; }
      .container { padding: 8px 14px 40px; }
      .section { padding-top: 30px; }
      .section-head { gap: 12px; margin-bottom: 18px; }
      .section-head > div:nth-child(2) { flex: 1; min-width: 0; }
      .section-icon { width: 42px; height: 42px; border-radius: 12px; }
      .section-head h2 { font-size: 18px; }
      .section-head p { display: none; }
      .count { font-size: 12px; padding: 3px 9px; }
      .certs { gap: 16px; }
      .modal { padding: 10px; }
      .modal-content { padding: 54px 14px 16px; border-radius: 18px; }
      .modal-content h3 { font-size: 19px; }
      .modal-content img { max-height: 52vh; }
      .actions .btn { flex: 1 1 40%; text-align: center; padding: 10px 12px; }
      .gate-card { padding: 28px 20px 22px; }
    }
    @media (hover: none) { .cert:hover { transform: none; } .cert:hover .thumb img { transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } html { scroll-behavior: auto; } }

  </style>
</head>
<body class="gated">

<div class="gate" id="gate">
  <form class="gate-card" id="gateCard" autocomplete="off">
    <div class="gate-icon">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    </div>
    <h1 data-t="title">ملف الإنجازات</h1>
    <p data-t="gateSub">أدخل بيانات الدخول للاطلاع على الشهادات.</p>
    <label for="gUser" data-t="user">اسم المستخدم</label>
    <input type="text" id="gUser" autocapitalize="off" spellcheck="false" required />
    <label for="gPass" data-t="pass">كلمة المرور</label>
    <input type="password" id="gPass" inputmode="numeric" required />
    <button class="btn primary" type="submit" id="gBtn" data-t="enter">دخول</button>
    <div class="gate-error" id="gError" role="alert"></div>
  </form>
</div>

<nav class="topbar">
  <div class="topbar-inner">
    <button class="profile-btn" id="btnProfile" type="button" aria-label="عرض المعلومات الشخصية">
      <span class="avatar" data-avatar></span>
      <span class="brand" id="brand"></span>
    </button>
    <div class="nav-links" id="navLinks"></div>
    <label class="search">
      <input type="search" id="search" placeholder="بحث..." aria-label="بحث" />

          <div class="thumb" data-view="${esc(t('view'))}"><img src="${c.img}" alt="${ttl}" loading="lazy" onerror="this.style.opacity=.15"></div>
          <div class="body">
            <h3>${ttl}</h3>
            <div class="meta">
              <span class="tag issuer">${esc(issuerOf(c))}</span>
              <span class="tag">${c.year}</span>
              ${c.hours ? `<span class="tag hours">${t('hoursTag')(c.hours)}</span>` : ''}
            </div>
          </div>
        </button>`;
      }).join('');

      const empty = !total ? `
        <div class="placeholder">
          <b>${t('soon')}</b>
          ${t('soonHint')} <code>CERTS</code> ${t('soonHint2')} <code>cat:'${s.id}'</code>
        </div>` : '';

      html += `
      <section class="section" id="${s.id}" style="--c:${s.color}">
        <div class="section-head">
          <div class="section-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${s.icon}</svg></div>
          <div><h2>${L(s, 'title')}</h2><p>${L(s, 'desc')}</p></div>
          <span class="count">${total} ${total === 1 ? t('cert') : t('certs')}</span>
        </div>
        <div class="certs">${cards}${empty}</div>
      </section>`;
    });

    $('main').innerHTML = html;
    $('noResults').style.display = q && !shown ? 'block' : 'none';
    observe();
  }

  function setLang(l) {
    lang = l;
    try { localStorage.setItem('lang', l); } catch (_) {}
    const root = document.documentElement;
    root.lang = l; root.dir = l === 'ar' ? 'rtl' : 'ltr';
    document.title = t('title');
    $('btnLang').textContent = l === 'ar' ? 'EN' : 'عربي';
    $('search').placeholder = t('search');
    $('btnDownload').textContent = t('download');
    $('btnClose2').textContent = t('close');
    $('btnVerify').textContent = t('verify');
    $('btnZoom').textContent = t('zoom');
    $('lbIn').setAttribute('aria-label', t('zoom'));
    $('lbOut').setAttribute('aria-label', t('zoomOut'));
    $('noResults').textContent = t('none');
    $('heroTitle').textContent = t('heroTitle');
    $('heroName').textContent = t('name');
    $('lblCount').textContent = t('certs');
    $('brand').innerHTML = t('brand');
    $('footer').textContent = t('footer');
    $('btnClose').setAttribute('aria-label', t('close'));
    $('profileClose').setAttribute('aria-label', t('close'));
    document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
    $('navLinks').innerHTML = SECTIONS.map(s => `<a href="#${s.id}" data-nav="${s.id}">${L(s, 'title')}</a>`).join('');
    render();
    if ($('modal').classList.contains('active')) openModal(state.index);
    if ($('profileModal').classList.contains('active')) openProfile();
    if ($('pickModal').classList.contains('active')) renderPicker();
  }
  $('btnLang').onclick = () => setLang(lang === 'ar' ? 'en' : 'ar');

  $('search').addEventListener('input', (e) => { state.q = e.target.value.trim().toLowerCase(); render(); });
  $('main').addEventListener('click', (e) => {
    const card = e.target.closest('[data-i]');
    if (card) openModal(+card.dataset.i);
  });

  /* Active nav highlight */
  let io;
  function observe() {
    if (io) io.disconnect();
    io = new IntersectionObserver((entries) => {
      entries.forEach(en => {
        if (en.isIntersecting) {
          document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('active', a.dataset.nav === en.target.id));
          const act = document.querySelector('[data-nav].active'), nav = $('navLinks');
          if (act) {                                   // اجعل الرابط النشط ظاهرًا كاملًا في الشريط
            const a = act.getBoundingClientRect(), n = nav.getBoundingClientRect();
            if (a.right > n.right) nav.scrollBy({ left: a.right - n.right + 8, behavior: 'smooth' });
            else if (a.left < n.left) nav.scrollBy({ left: a.left - n.left - 8, behavior: 'smooth' });
          }
        }
      });
    }, { rootMargin: '-35% 0px -60% 0px' });
    document.querySelectorAll('.section').forEach(s => io.observe(s));
  }

  /* ===================== النافذة ===================== */
  function openModal(i) {
    if (!state.visible.length) return;
    state.index = (i + state.visible.length) % state.visible.length;
    const c = state.visible[state.index];
    $('modalImg').src = c.img;
    $('modalImg').alt = L(c, 'title');
    $('modalTitle').textContent = L(c, 'title');
    $('modalInfo').textContent = L(c, 'desc') || '';
    $('modalMeta').innerHTML =
      `<span class="tag issuer">${esc(issuerOf(c))}</span><span class="tag">${c.year}</span>` +
      (c.hours ? `<span class="tag hours">${t('hoursLong')(c.hours)}</span>` : '') +
      `<span class="tag">${L(secOf(c.cat), 'title')}</span>`;
    const v = $('btnVerify');
    v.hidden = !c.verify;
    if (c.verify) v.href = c.verify;
    $('modal').classList.add('active');
    document.body.classList.add('locked');
  }
  function closeModal() { $('modal').classList.remove('active'); document.body.classList.remove('locked'); }
  function downloadFile(c) {
    const a = document.createElement('a');
    a.href = c.img;
    a.download = `${L(c, 'title')}.${c.img.split('.').pop()}`;
    document.body.appendChild(a); a.click(); a.remove();
  }
  const downloadCert = () => downloadFile(state.visible[state.index]);
  $('btnClose').onclick = $('btnClose2').onclick = closeModal;
  $('btnDownload').onclick = downloadCert;
  $('modal').addEventListener('click', (e) => { if (e.target === $('modal')) closeModal(); });
  document.addEventListener('keydown', (e) => {
    if (!$('modal').classList.contains('active')) return;
    if (e.key === 'Escape' && !$('lightbox').classList.contains('active')) closeModal();
  });

  /* ===================== اختيار الشهادة للتحميل ===================== */
  function renderPicker() {
    $('pickList').innerHTML = SECTIONS.map(s => {
      const items = CERTS.map((c, k) => [c, k]).filter(([c]) => c.cat === s.id);
      if (!items.length) return '';
      return `<div class="pick-sec">${L(s, 'title')}</div>` + items.map(([c, k]) =>
        `<button class="pick-item" type="button" data-k="${k}"><span>${esc(L(c, 'title'))} · ${c.year}</span><span class="pick-dl">↓</span></button>`).join('');
    }).join('');
  }
  function openPicker() { renderPicker(); $('pickModal').classList.add('active'); document.body.classList.add('locked'); }
  function closePicker() { $('pickModal').classList.remove('active'); document.body.classList.remove('locked'); }
  $('btnDownloadAll').onclick = openPicker;
  $('pickClose').onclick = closePicker;
  $('pickModal').addEventListener('click', (e) => { if (e.target === $('pickModal')) closePicker(); });
  $('pickList').addEventListener('click', (e) => {
    const b = e.target.closest('[data-k]');
    if (!b) return;
    downloadFile(CERTS[+b.dataset.k]);
    b.classList.add('done'); b.querySelector('.pick-dl').textContent = '✓';
  });

  /* ===================== تكبير الشهادة ===================== */
  let zoom = 1;
  function applyZoom() {
    const img = $('lbImg');
    img.className = zoom === 1 ? 'fit' : 'zoomed';
    img.style.width = zoom === 1 ? '' : (zoom * 100) + '%';
    $('lbPct').textContent = Math.round(zoom * 100) + '%';
  }
  function openLightbox() {
    const c = state.visible[state.index];
    if (!c) return;
    $('lbImg').src = c.img; $('lbImg').alt = L(c, 'title');
    zoom = 1; applyZoom();
    $('lbStage').scrollTo(0, 0);
    $('lightbox').classList.add('active');
  }
  function closeLightbox() { $('lightbox').classList.remove('active'); }
  $('btnZoom').onclick = openLightbox;
  $('lbClose').onclick = closeLightbox;
  $('lbIn').onclick = () => { zoom = Math.min(4, zoom + 0.5); applyZoom(); };
  $('lbOut').onclick = () => { zoom = Math.max(1, zoom - 0.5); applyZoom(); };
  $('lbImg').onclick = () => { zoom = zoom === 1 ? 2.5 : 1; applyZoom(); };
  $('lightbox').addEventListener('keydown', () => {});
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if ($('lightbox').classList.contains('active')) closeLightbox();
    else if ($('pickModal').classList.contains('active')) closePicker();
  });

  /* ===================== الملف الشخصي ===================== */
  const PROFILE = { initial: 'ب' };

  function openProfile() {
    $('pName').textContent = t('name');
    $('pRole').textContent = t('role');
    $('pRows').innerHTML = [
      { label: t('age'), value: t('ageVal') }
      // لإضافة صف جديد: أضف { label: '...', value: '...' }
    ].map(r => `<div class="p-row"><span>${r.label}</span><b>${r.value}</b></div>`).join('');
    $('profileModal').classList.add('active');
    document.body.classList.add('locked');
  }
  function closeProfile() {
    $('profileModal').classList.remove('active');
    document.body.classList.remove('locked');
  }
  document.querySelectorAll('[data-avatar]').forEach(el => { el.textContent = PROFILE.initial; });
  $('btnProfile').onclick = openProfile;
  $('profileClose').onclick = closeProfile;
  $('profileModal').addEventListener('click', (e) => { if (e.target === $('profileModal')) closeProfile(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && $('profileModal').classList.contains('active')) closeProfile();
  });

  /* ===================== بوابة الدخول ===================== */
  // SHA-256 لقيمة: "اسم المستخدم بحروف صغيرة" + ":" + "كلمة المرور"
  const AUTH_HASH = '6119ef2864c806b681c7d96ca0f4a5b33602ba45d4c419d2ba791a3ccca65b1d';
  const SESSION_KEY = 'achievements_unlocked';
  let failed = 0, lockedUntil = 0;

  async function sha256(text) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }
  function unlock() {
    document.body.classList.remove('gated');
    document.title = t('title');
    runStats();
    render();
  }
  function showError(msg) {
    $('gError').textContent = msg;
    const card = $('gateCard');
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
  }

  $('gateCard').addEventListener('submit', async (e) => {
    e.preventDefault();
    const now = Date.now();
    if (now < lockedUntil) {
      showError(t('lockN')(Math.ceil((lockedUntil - now) / 1000)));
      return;
    }
    if (!(window.crypto && crypto.subtle)) {
      showError(t('nocrypto'));
      return;
    }
    $('gBtn').disabled = true;
    const user = $('gUser').value.trim().toLowerCase();
    const pass = $('gPass').value.trim();
    const hash = await sha256(user + ':' + pass);
    await new Promise(r => setTimeout(r, 500));
    $('gBtn').disabled = false;

    if (hash === AUTH_HASH) {
      try { sessionStorage.setItem(SESSION_KEY, '1'); } catch (_) {}
      unlock();
    } else {
      failed++;
      $('gPass').value = '';
      if (failed >= 5) { lockedUntil = Date.now() + 30000; failed = 0; showError(t('lock30')); }
      else showError(t('wrong'));
    }
  });

  setLang(lang);

  let remembered = false;
  try { remembered = sessionStorage.getItem(SESSION_KEY) === '1'; } catch (_) {}
  if (remembered) unlock(); else $('gUser').focus();
</script>
</body>
</html>
